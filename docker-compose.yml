version: '3.8'

services:
  msisdn-bot:
    build: .
    container_name: telegram-msisdn-bot
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLLING_TIMEOUT=${POLLING_TIMEOUT:-30}
      - READ_TIMEOUT=${READ_TIMEOUT:-60}
    volumes:
      - ./logs:/app/logs  # اختياري: حفظ الـ logs
    networks:
      - telegram-network
    # صحة الخدمة (healthcheck)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  telegram-network:
    driver: bridge
